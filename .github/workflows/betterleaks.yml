name: Betterleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  betterleaks:
    name: Betterleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install Betterleaks
        run: go install github.com/betterleaks/betterleaks@v1.10.1
      - name: Scan changed commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          log_opts="--full-history --diff-filter=tuxdb --diff-merges=first-parent"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="$log_opts ${PR_BASE_SHA}..${HEAD_SHA}"
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            log_opts="$log_opts --root ${HEAD_SHA}"
          else
            log_opts="$log_opts ${PUSH_BEFORE_SHA}..${HEAD_SHA}"
          fi
          betterleaks --config .betterleaks.toml --redact=100 --no-banner git . --log-opts="$log_opts"
